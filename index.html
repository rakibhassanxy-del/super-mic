<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Typing - Premium Cloud Mic</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --primary: #0284C7; --gold: #D4AF37; --surface: rgba(255, 255, 255, 0.85); --text: #0F172A; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #F0FDF4 0%, #E0F2FE 100%); color: var(--text); text-align: center; padding: 20px; display: flex; flex-direction: column; justify-content: center; min-height: 90vh; margin: 0; }
        h2 { color: var(--primary); font-weight: 800; font-size: 28px; margin-bottom: 5px; letter-spacing: -0.5px; }
        p { color: #64748B; font-size: 14px; font-weight: 600; margin-bottom: 40px; }
        
        .mic-container { position: relative; width: 150px; height: 150px; margin: 0 auto; display: flex; justify-content: center; align-items: center; }
        .btn { background: var(--surface); backdrop-filter: blur(12px); border: 1.5px solid #CBD5E1; border-radius: 50%; width: 120px; height: 120px; cursor: pointer; position: relative; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.06); transition: all 0.4s; display: flex; align-items: center; justify-content: center; }
        .btn svg { width: 45px; height: 45px; fill: #475569; transition: all 0.3s; }
        .btn.recording { background: #FFFFFF; border-color: #EF4444; transform: scale(1.05); box-shadow: 0 15px 35px rgba(239, 68, 68, 0.25); }
        .btn.recording svg { fill: #EF4444; }
        .mic-container.recording::before { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; background: rgba(239, 68, 68, 0.2); animation: pulse 1.5s infinite ease-out; z-index: 1; }
        .btn.processing { background: #FFFFFF; border-color: var(--gold); transform: scale(1); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); animation: breathe 1.5s infinite; }
        .btn.processing svg { fill: var(--gold); }

        @keyframes pulse { 0% { transform: scale(0.85); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .status { margin-top: 35px; font-size: 16px; color: #64748B; font-weight: 600; height: 24px; transition: color 0.3s; }
        .text-out { margin-top: 25px; font-size: 18px; color: #1E293B; min-height: 90px; padding: 25px; border-radius: 20px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(16px); box-shadow: 0 8px 32px rgba(0,0,0,0.04); border: 1px solid rgba(255,255,255,0.8); line-height: 1.5; }
        .badge { font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 20px; display: inline-block; margin-bottom: 25px; }
        .connected { color: #059669; background: #D1FAE5; border: 1px solid #A7F3D0; }
        .disconnected { color: #DC2626; background: #FEE2E2; border: 1px solid #FECACA; }
    </style>
</head>
<body>
    <div id="connStatus" class="badge disconnected">🔴 PC Disconnected</div>
    <h2>⚡ Super Typing</h2>
    <p>Premium Cloud Audio Engine</p>
    
    <div class="mic-container" id="micWrapper">
        <button class="btn" id="talkBtn" onclick="toggleRecord()">
            <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
    </div>
    <div class="status" id="stat">Tap once to start speaking</div>
    <div class="text-out" id="textOut">Super AI is ready...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        if(!sessionId) {
            document.getElementById('connStatus').innerText = "⚠️ Invalid Session! Scan PC QR Code.";
            document.getElementById('connStatus').className = 'badge disconnected';
        }

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topic = 'supertyping/mic/' + (sessionId || 'test');

        client.on('connect', function () {
            if(sessionId) {
                document.getElementById('connStatus').className = 'badge connected';
                document.getElementById('connStatus').innerText = "🟢 Connected to PC";
            }
        });

        let recognition;
        let isRec = false;
        let final_transcript = '';
        let typingTimer;

        const svgMic = '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>';
        const svgProcess = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>';

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = true; 
            recognition.interimResults = true;
            recognition.lang = 'bn-BD';

            recognition.onresult = function(e) {
                clearTimeout(typingTimer); 
                let interim_transcript = '';
                
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        final_transcript += e.results[i][0].transcript + " ";
                    } else {
                        interim_transcript += e.results[i][0].transcript;
                    }
                }
                
                document.getElementById('textOut').innerText = final_transcript + interim_transcript;
                
                typingTimer = setTimeout(function() {
                    if(final_transcript.trim() !== "") {
                        sendDataAndStop(final_transcript.trim());
                    }
                }, 1500); // 1.5s silence triggers send
            };

            recognition.onerror = function(e) { 
                if(e.error !== 'no-speech') resetUI(); 
            };
        }

        function sendDataAndStop(text) {
            try { recognition.stop(); } catch(e){}
            document.getElementById('talkBtn').className = 'btn processing';
            document.getElementById('micIcon').innerHTML = svgProcess;
            document.getElementById('stat').innerText = "✨ Formatting & Pasting...";
            document.getElementById('stat').style.color = "var(--gold)";
            
            client.publish(topic, JSON.stringify({ type: 'final', text: text, msg_id: Date.now() }));
            
            // Crucial: Clear memory so it doesn't repeat old sentences
            final_transcript = ""; 
            setTimeout(resetUI, 1200);
        }

        function resetUI() {
            document.getElementById('talkBtn').className = 'btn';
            document.getElementById('micIcon').innerHTML = svgMic;
            document.getElementById('micWrapper').className = 'mic-container';
            document.getElementById('stat').innerText = 'Tap once to start speaking';
            document.getElementById('stat').style.color = "#64748B";
            isRec = false;
        }

        function toggleRecord() {
            if (!sessionId) { alert("Please scan the QR code from PC!"); return; }
            if (!isRec) {
                final_transcript = "";
                document.getElementById('textOut').innerText = 'Listening...';
                try { recognition.start(); } catch(e){}
                document.getElementById('talkBtn').className = 'btn recording';
                document.getElementById('micIcon').innerHTML = svgMic;
                document.getElementById('micWrapper').className = 'mic-container recording';
                document.getElementById('stat').innerText = '🔴 Speak now (Auto-stops when silent)';
                document.getElementById('stat').style.color = "#EF4444";
                isRec = true;
            } else {
                clearTimeout(typingTimer);
                if(final_transcript.trim() !== "") {
                    sendDataAndStop(final_transcript.trim());
                } else {
                    try { recognition.stop(); } catch(e){}
                    resetUI();
                }
            }
        }
    </script>
</body>
</html>
