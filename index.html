<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Typing - Pro Mic</title>
    <!-- MQTT Protocol Library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0F172A; color: white; text-align: center; padding: 20px; display: flex; flex-direction: column; justify-content: center; height: 90vh; margin: 0; }
        h2 { color: #F59E0B; margin-bottom: 5px; font-weight: 700; }
        p { color: #94A3B8; font-size: 13px; margin-bottom: 30px; }
        .btn { background: #059669; color: white; border: 3px solid #10B981; padding: 20px; font-size: 35px; border-radius: 50%; width: 120px; height: 120px; cursor: pointer; margin: 0 auto; box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.5); transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .btn.recording { background: #EF4444; border-color: #F87171; animation: pulse 1.5s infinite; box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.5); }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { transform: scale(1); } }
        .status { margin-top: 25px; font-size: 18px; color: #FCD34D; font-weight: 600; }
        .text-out { margin-top: 25px; font-size: 16px; color: #E2E8F0; min-height: 60px; padding: 15px; border: 1px dashed #475569; border-radius: 12px; background: #1E293B; }
        .connected { color: #10B981; font-size: 14px; font-weight: bold; margin-bottom: 20px; background: rgba(16, 185, 129, 0.1); padding: 8px; border-radius: 20px; display: inline-block; }
        .disconnected { color: #EF4444; font-size: 14px; font-weight: bold; margin-bottom: 20px; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 20px; display: inline-block; }
    </style>
</head>
<body>
    <h2>⚡ Super Typing</h2>
    <p>Premium Wireless Microphone</p>
    
    <div id="connStatus" class="disconnected">🔴 পিসির সাথে কানেক্ট হচ্ছে...</div>
    
    <button class="btn" id="talkBtn" onclick="toggleRecord()">🎙️</button>
    <div class="status" id="stat">মাইক অন করতে ট্যাপ করুন</div>
    <div class="text-out" id="textOut">আপনার কথা এখানে লাইভ টাইপ হবে...</div>

    <script>
        // URL থেকে পিসির সিক্রেট সেশন আইডি নেওয়া
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        
        if(!sessionId) {
            document.getElementById('connStatus').innerText = "⚠️ ইনভ্যালিড! পিসির QR Code স্ক্যান করে ঢুকুন।";
            document.getElementById('connStatus').className = 'disconnected';
        }

        // ফ্রি ক্লাউড MQTT ব্রোকারের সাথে কানেকশন
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topic = 'supertyping/mic/' + sessionId;

        client.on('connect', function () {
            if(sessionId) {
                document.getElementById('connStatus').className = 'connected';
                document.getElementById('connStatus').innerText = "🟢 পিসির সাথে কানেক্টেড (Secure)";
            }
        });

        let recognition;
        let isRec = false;
        let final_transcript = '';

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = true; 
            recognition.interimResults = true; // লাইভ টাইপিংয়ের জন্য
            recognition.lang = 'bn-BD';

            recognition.onresult = function(e) {
                let interim_transcript = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        final_transcript = e.results[i][0].transcript;
                        // কথা শেষ হলে পিসিতে ডাটা পাঠানো
                        client.publish(topic, JSON.stringify({ type: 'final', text: final_transcript }));
                        document.getElementById('textOut').innerText = final_transcript;
                        final_transcript = ''; 
                    } else {
                        interim_transcript += e.results[i][0].transcript;
                        document.getElementById('textOut').innerText = interim_transcript;
                    }
                }
            };

            recognition.onerror = function(e) {
                document.getElementById('stat').innerText = "⚠️ Error: মাইক পারমিশন দিন!";
                stopRec();
            };
        } else {
            document.getElementById('stat').innerText = "⚠️ আপনার ব্রাউজারে মাইক সাপোর্ট নেই।";
        }

        function toggleRecord() {
            if (!sessionId) { alert("পিসির QR Code স্ক্যান করে ঢুকুন!"); return; }
            if (!isRec) {
                try { recognition.start(); } catch(e){}
                document.getElementById('talkBtn').classList.add('recording');
                document.getElementById('stat').innerText = 'শুনছি... কথা বলুন';
                isRec = true;
            } else {
                stopRec();
            }
        }
        
        function stopRec() {
            try { recognition.stop(); } catch(e){}
            document.getElementById('talkBtn').classList.remove('recording');
            document.getElementById('stat').innerText = 'মাইক অফ আছে';
            isRec = false;
        }
    </script>
</body>
</html>
